name: Build Desktop App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build (Windows x64)
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find built exe
        id: find_exe
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path "dist-electron" -Filter "*.exe" | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $exe) { Write-Error "No .exe found in dist-electron"; exit 1 }
          echo "EXE_PATH=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "EXE_NAME=$($exe.Name)" >> $env:GITHUB_OUTPUT
          echo "Found: $($exe.FullName)"

      - name: Upload exe to server via SCP
        shell: powershell
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          EXE_PATH: ${{ steps.find_exe.outputs.EXE_PATH }}
          EXE_NAME: ${{ steps.find_exe.outputs.EXE_NAME }}
        run: |
          # Write SSH key to temp file
          $keyPath = "$env:TEMP\deploy_key"
          $env:SSH_KEY | Out-File -FilePath $keyPath -Encoding ascii -NoNewline
          
          # Fix line endings (key must be Unix format)
          $content = [System.IO.File]::ReadAllText($keyPath) -replace "`r`n", "`n" -replace "`r", "`n"
          [System.IO.File]::WriteAllText($keyPath, $content)

          # Ensure downloads directory exists on server before SCP
          $sshArgs = @(
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=/dev/null",
            "-i", $keyPath,
            "$($env:SERVER_USER)@$($env:SERVER_HOST)",
            "sudo mkdir -p /www/wwwroot/cardyn.net/downloads && sudo chmod 755 /www/wwwroot/cardyn.net/downloads && sudo chown $($env:SERVER_USER):$($env:SERVER_USER) /www/wwwroot/cardyn.net/downloads"
          )
          & ssh @sshArgs
          if ($LASTEXITCODE -ne 0) { Write-Warning "mkdir/chmod failed but continuing..." }

          # SCP the exe to server
          $scpArgs = @(
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=/dev/null",
            "-i", $keyPath,
            $env:EXE_PATH,
            "$($env:SERVER_USER)@$($env:SERVER_HOST):/www/wwwroot/cardyn.net/downloads/"
          )
          & scp @scpArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          
          Remove-Item $keyPath -Force
          echo "Uploaded: $env:EXE_NAME"

      - name: Generate latest.yml on server
        shell: powershell
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          $keyPath = "$env:TEMP\deploy_key2"
          $env:SSH_KEY | Out-File -FilePath $keyPath -Encoding ascii -NoNewline
          $content = [System.IO.File]::ReadAllText($keyPath) -replace "`r`n", "`n" -replace "`r", "`n"
          [System.IO.File]::WriteAllText($keyPath, $content)

          $script = @'
          cd /www/wwwroot/cardyn.net/downloads
          EXE=$(ls "Cardyn Staff Setup"*.exe 2>/dev/null | sort -V | tail -1)
          if [ -z "$EXE" ]; then EXE=$(ls *.exe 2>/dev/null | sort -V | tail -1); fi
          if [ -n "$EXE" ] && [ -f "$EXE" ]; then
            VERSION=$(echo "$EXE" | grep -oP '\d+\.\d+\.\d+' | head -1)
            RELEASE_DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
            SIZE=$(stat -c%s "$EXE")
            SHA512=$(sha512sum "$EXE" | awk '{print $1}' | xxd -r -p | base64 -w0)
            EXE_ENCODED=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$EXE'))")
            cat > latest.yml << YMLEOF
          version: $VERSION
          files:
            - url: $EXE_ENCODED
              sha512: $SHA512
              size: $SIZE
          path: $EXE_ENCODED
          sha512: $SHA512
          releaseDate: '$RELEASE_DATE'
          YMLEOF
            echo "Done: version=$VERSION file=$EXE"
            cat latest.yml
          else
            echo "ERROR: no exe found"; ls -la; exit 1
          fi
          '@

          $sshArgs = @(
            "-o", "StrictHostKeyChecking=no",
            "-o", "UserKnownHostsFile=/dev/null",
            "-i", $keyPath,
            "$($env:SERVER_USER)@$($env:SERVER_HOST)",
            $script
          )
          & ssh @sshArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item $keyPath -Force

      - name: Get version
        id: version
        shell: powershell
        run: |
          $v = node -p "require('./package.json').version"
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "tag=v$v-build.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Cardyn Staff v${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            ## Cardyn Staff Desktop v${{ steps.version.outputs.version }}

            | Platform | Download | Notes |
            |----------|----------|-------|
            | 🪟 Windows | [Download .exe](https://cardyn.net/downloads/Cardyn%20Staff%20Setup%20${{ steps.version.outputs.version }}.exe) | Windows 10/11 |

            > Installed users get auto-update within 4 hours.

            **Build:** ${{ github.run_number }} | **Commit:** ${{ github.sha }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
