name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:  # allow manual trigger from GitHub UI

jobs:
  build-mac:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + Electron (macOS)
        run: npm run electron:build
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable electron-builder auto-publish — our release job handles it
          EP_DRAFT: false
          EP_PRE_RELEASE: false

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardyn-staff-mac
          path: dist-electron/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite + Electron (Windows)
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardyn-staff-windows
          path: dist-electron/*.exe
          if-no-files-found: warn

  # Optional: create a GitHub Release with both files when you push a tag like v1.0.0
  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Mac artifact
        uses: actions/download-artifact@v4
        with:
          name: cardyn-staff-mac
          path: release/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cardyn-staff-windows
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
