name: Build Desktop App

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-mac-arm:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build (macOS Apple Silicon)
        run: npm run build && npx electron-builder --mac --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload mac-arm artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardyn-staff-mac-arm64
          path: dist-electron/*.dmg
          if-no-files-found: warn

  build-mac-intel:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build (macOS Intel)
        run: npm run build && npx electron-builder --mac --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Upload mac-intel artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardyn-staff-mac-x64
          path: dist-electron/*.dmg
          if-no-files-found: warn

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Build (Windows x64)
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardyn-staff-windows
          path: dist-electron/*.exe
          if-no-files-found: warn

  release:
    needs: [build-mac-arm, build-mac-intel, build-windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-build.${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release/
          merge-multiple: true

      - name: Rename artifacts clearly
        run: |
          cd release
          for f in *.dmg; do
            if [[ "$f" == *arm64* ]]; then
              mv "$f" "Cardyn-Staff-mac-AppleSilicon.dmg" 2>/dev/null || true
            elif [[ "$f" == *x64* ]] || [[ "$f" == *64* ]]; then
              mv "$f" "Cardyn-Staff-mac-Intel.dmg" 2>/dev/null || true
            fi
          done
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Cardyn Staff v${{ steps.version.outputs.version }} (build ${{ github.run_number }})"
          body: |
            ## Cardyn Staff Desktop v${{ steps.version.outputs.version }}

            ### 下载 / Downloads
            | 平台 | 文件 | 说明 |
            |------|------|------|
            | 🍎 Mac (Apple Silicon M1/M2/M3) | `Cardyn-Staff-mac-AppleSilicon.dmg` | 新款Mac |
            | 🍎 Mac (Intel) | `Cardyn-Staff-mac-Intel.dmg` | 老款Mac |
            | 🪟 Windows | `Cardyn Staff Setup *.exe` | Windows 10/11 |

            **Build:** ${{ github.run_number }} | **Commit:** ${{ github.sha }}
          files: release/*
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
