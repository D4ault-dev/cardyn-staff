name: Build Cardyn Staff v2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ── macOS build → directly SCP to server (no artifact storage needed) ───────
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src-tauri/target/release/bundle/dmg/*.dmg,src-tauri/target/release/bundle/macos/*.app.tar.gz,src-tauri/target/release/bundle/macos/*.app.tar.gz.sig"
          target: "/www/wwwroot/cardyn.net/downloads/"
          strip_components: 7

  # ── Windows build → directly SCP to server ──────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload Windows build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "src-tauri/target/release/bundle/nsis/*.exe,src-tauri/target/release/bundle/nsis/*.exe.sig"
          target: "/www/wwwroot/cardyn.net/downloads/"
          strip_components: 7

  # ── After both builds upload, generate the updater JSON ─────────────────────
  deploy:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: always() && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Generate tauri-latest.json + create GitHub Release
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /www/wwwroot/cardyn.net/downloads
            VERSION="${{ steps.version.outputs.version }}"
            DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

            WIN_NSIS=$(ls Cardyn*.exe 2>/dev/null | grep -v sig | head -1 || echo "")
            WIN_SIG=$(ls Cardyn*.exe.sig 2>/dev/null | head -1 || echo "")
            MAC_TAR=$(ls Cardyn*.app.tar.gz 2>/dev/null | grep -v sig | head -1 || echo "")
            MAC_SIG=$(ls Cardyn*.app.tar.gz.sig 2>/dev/null | head -1 || echo "")

            cat > tauri-latest.json << ENDJSON
            {
              "version": "$VERSION",
              "notes": "Cardyn Staff v$VERSION — improvements and bug fixes",
              "pub_date": "$DATE",
              "platforms": {
                "windows-x86_64": {
                  "signature": "$(cat "$WIN_SIG" 2>/dev/null || echo '')",
                  "url": "https://cardyn.net/downloads/$WIN_NSIS"
                },
                "darwin-x86_64": {
                  "signature": "$(cat "$MAC_SIG" 2>/dev/null || echo '')",
                  "url": "https://cardyn.net/downloads/$MAC_TAR"
                },
                "darwin-aarch64": {
                  "signature": "$(cat "$MAC_SIG" 2>/dev/null || echo '')",
                  "url": "https://cardyn.net/downloads/$MAC_TAR"
                }
              }
            }
            ENDJSON

            echo "=== tauri-latest.json ==="
            cat tauri-latest.json
            echo "=== Downloads dir ==="
            ls -lh
