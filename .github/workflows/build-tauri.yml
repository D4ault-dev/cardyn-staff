name: Build Cardyn Staff v2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Required for tauri-action to create GitHub Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app + create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Cardyn Staff v__VERSION__'
          releaseBody: 'Cardyn Staff v__VERSION__ — download the installer for your platform below.'
          releaseDraft: false
          prerelease: false

  # Upload installers to cardyn.net server for auto-update
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for all release assets (build jobs take ~15min)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Waiting for v$VERSION release assets..."
          # Wait up to 20 minutes for all 4 expected files to appear
          # (.exe + .exe.sig + .app.tar.gz + .app.tar.gz.sig)
          for i in $(seq 1 40); do
            ASSET_COUNT=$(gh release view "v$VERSION" --json assets --jq '.assets | length' 2>/dev/null || echo 0)
            echo "Attempt $i: $ASSET_COUNT assets found"
            if [ "$ASSET_COUNT" -ge 8 ]; then
              echo "All assets ready"
              break
            fi
            sleep 30
          done
          gh release view "v$VERSION" --json assets --jq '.assets[].name'

      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-files
          VERSION="${{ steps.version.outputs.version }}"
          gh release download "v$VERSION" --dir release-files
          echo "=== Downloaded files ==="
          ls -lah release-files/

      - name: Build tauri-latest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          cd release-files

          # Windows NSIS installer + sig
          WIN_FILE=$(ls Cardyn*_${VERSION}_x64-setup.exe 2>/dev/null | head -1 || echo "")
          WIN_SIG=$(cat "${WIN_FILE}.sig" 2>/dev/null || echo "")

          # macOS aarch64 updater bundle + sig
          MAC_ARM_FILE=$(ls Cardyn*_aarch64.app.tar.gz 2>/dev/null | head -1 || echo "")
          MAC_ARM_SIG=$(cat "${MAC_ARM_FILE}.sig" 2>/dev/null || echo "")

          # macOS x64 updater bundle + sig (may not exist if only arm build)
          MAC_X64_FILE=$(ls Cardyn*_x64.app.tar.gz 2>/dev/null | head -1 || echo "$MAC_ARM_FILE")
          MAC_X64_SIG=$(cat "${MAC_X64_FILE}.sig" 2>/dev/null || echo "$MAC_ARM_SIG")

          echo "WIN:      $WIN_FILE"
          echo "WIN SIG:  ${WIN_SIG:0:30}..."
          echo "MAC ARM:  $MAC_ARM_FILE"
          echo "MAC SIG:  ${MAC_ARM_SIG:0:30}..."

          cat > ../tauri-latest.json << ENDJSON
          {
            "version": "$VERSION",
            "notes": "Cardyn Staff v$VERSION",
            "pub_date": "$DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "https://cardyn.net/downloads/$WIN_FILE"
              },
              "darwin-aarch64": {
                "signature": "$MAC_ARM_SIG",
                "url": "https://cardyn.net/downloads/$MAC_ARM_FILE"
              },
              "darwin-x86_64": {
                "signature": "$MAC_X64_SIG",
                "url": "https://cardyn.net/downloads/$MAC_X64_FILE"
              }
            }
          }
          ENDJSON
          echo "=== tauri-latest.json ===" && cat ../tauri-latest.json

      - name: Upload installers to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "release-files/Cardyn*,tauri-latest.json"
          target: "/www/wwwroot/cardyn.net/downloads/"
          strip_components: 1

      - name: Clean old versions on server (keep only last 2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /www/wwwroot/cardyn.net/downloads
            # Keep only the 2 most recent versions — delete everything older
            ls -t Cardyn.Staff_*.exe 2>/dev/null | tail -n +3 | xargs -r rm -f
            ls -t Cardyn.Staff_*.dmg 2>/dev/null | tail -n +3 | xargs -r rm -f
            ls -t Cardyn.Staff_*.msi 2>/dev/null | tail -n +3 | xargs -r rm -f
            ls -t Cardyn.Staff_*.app.tar.gz 2>/dev/null | tail -n +3 | xargs -r rm -f
            ls -t Cardyn.Staff_*.sig 2>/dev/null | tail -n +3 | xargs -r rm -f
            echo "=== Current downloads ===" && ls -lah
            echo "=== tauri-latest.json ===" && cat tauri-latest.json
