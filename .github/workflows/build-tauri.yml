name: Build Cardyn Staff v2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Required for tauri-action to create GitHub Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app + create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Cardyn Staff v__VERSION__'
          releaseBody: 'Cardyn Staff v__VERSION__ — download the installer for your platform below.'
          releaseDraft: false
          prerelease: false

  # Upload installers to cardyn.net server for auto-update
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Wait for release assets to be available
        run: sleep 30

      - name: Download release assets from GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-files
          VERSION="${{ steps.version.outputs.version }}"
          gh release download "v$VERSION" --dir release-files --skip-existing || true
          ls -la release-files/

      - name: Upload to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "release-files/*"
          target: "/www/wwwroot/cardyn.net/downloads/"
          strip_components: 1

      - name: Generate tauri-latest.json on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /www/wwwroot/cardyn.net/downloads
            VERSION="${{ steps.version.outputs.version }}"
            DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

            # Windows — NSIS installer (.exe) + its .sig
            WIN_FILE=$(ls Cardyn*_${VERSION}_x64-setup.exe 2>/dev/null | head -1 || ls *_x64-setup.exe 2>/dev/null | head -1 || echo "")
            WIN_SIG_FILE="${WIN_FILE}.sig"
            WIN_SIG=$(cat "$WIN_SIG_FILE" 2>/dev/null || echo "")

            # macOS — app tarball (.app.tar.gz) + its .sig — prefer aarch64
            MAC_FILE=$(ls Cardyn*_aarch64.app.tar.gz 2>/dev/null | head -1 || ls *.app.tar.gz 2>/dev/null | head -1 || echo "")
            MAC_SIG_FILE="${MAC_FILE}.sig"
            MAC_SIG=$(cat "$MAC_SIG_FILE" 2>/dev/null || echo "")

            MAC_X64_FILE=$(ls Cardyn*_x64.app.tar.gz 2>/dev/null | head -1 || echo "$MAC_FILE")
            MAC_X64_SIG=$(cat "${MAC_X64_FILE}.sig" 2>/dev/null || echo "$MAC_SIG")

            echo "WIN: $WIN_FILE (sig: $(echo $WIN_SIG | cut -c1-20)...)"
            echo "MAC aarch64: $MAC_FILE (sig: $(echo $MAC_SIG | cut -c1-20)...)"
            echo "MAC x64: $MAC_X64_FILE"

            cat > tauri-latest.json << ENDJSON
            {
              "version": "$VERSION",
              "notes": "Cardyn Staff v$VERSION",
              "pub_date": "$DATE",
              "platforms": {
                "windows-x86_64": {
                  "signature": "$WIN_SIG",
                  "url": "https://cardyn.net/downloads/$WIN_FILE"
                },
                "darwin-aarch64": {
                  "signature": "$MAC_SIG",
                  "url": "https://cardyn.net/downloads/$MAC_FILE"
                },
                "darwin-x86_64": {
                  "signature": "$MAC_X64_SIG",
                  "url": "https://cardyn.net/downloads/$MAC_X64_FILE"
                }
              }
            }
            ENDJSON
            echo "=== tauri-latest.json ===" && cat tauri-latest.json
