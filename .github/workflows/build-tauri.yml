name: Build Cardyn Staff v2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Required for tauri-action to create GitHub Releases
permissions:
  contents: write

jobs:
  # ── Build on each platform ──────────────────────────────────────────────────
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: cardyn-staff-macos
          - os: windows-latest
            artifact_name: cardyn-staff-windows

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Cardyn Staff v__VERSION__'
          releaseBody: |
            ## Cardyn Staff v__VERSION__

            Built from commit ${{ github.sha }}

            ### Downloads
            - **Windows** — `.exe` installer below
            - **macOS** — `.dmg` installer below

            ### Auto-update
            Existing installs will be notified and updated automatically.
          releaseDraft: false
          prerelease: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 7
          if-no-files-found: warn

  # ── Upload installers to server for auto-update ────────────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: version
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: cardyn-staff-macos
          path: release-files/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cardyn-staff-windows
          path: release-files/

      - name: List release files
        run: ls -la release-files/ || echo "No files found"

      - name: Upload installers to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "release-files/*"
          target: "/www/wwwroot/cardyn.net/downloads/"
          strip_components: 1

      - name: Generate tauri-latest.json on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /www/wwwroot/cardyn.net/downloads
            VERSION="${{ steps.version.outputs.version }}"
            DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

            # Find built files
            WIN_NSIS=$(ls Cardyn*.exe 2>/dev/null | head -1)
            WIN_SIG=$(ls Cardyn*.exe.sig 2>/dev/null | head -1)
            MAC_DMG=$(ls Cardyn*.dmg 2>/dev/null | head -1)
            MAC_TAR=$(ls Cardyn*.app.tar.gz 2>/dev/null | head -1)
            MAC_SIG=$(ls Cardyn*.app.tar.gz.sig 2>/dev/null | head -1)

            # Build the Tauri updater JSON
            cat > tauri-latest.json << ENDJSON
            {
              "version": "$VERSION",
              "notes": "Cardyn Staff v$VERSION — improvements and bug fixes",
              "pub_date": "$DATE",
              "platforms": {
                "windows-x86_64": {
                  "signature": "$(cat $WIN_SIG 2>/dev/null || echo '')",
                  "url": "https://cardyn.net/downloads/$WIN_NSIS"
                },
                "darwin-x86_64": {
                  "signature": "$(cat $MAC_SIG 2>/dev/null || echo '')",
                  "url": "https://cardyn.net/downloads/$MAC_TAR"
                },
                "darwin-aarch64": {
                  "signature": "$(cat $MAC_SIG 2>/dev/null || echo '')",
                  "url": "https://cardyn.net/downloads/$MAC_TAR"
                }
              }
            }
            ENDJSON

            echo "=== tauri-latest.json ==="
            cat tauri-latest.json
            echo "=== Downloads dir ==="
            ls -la
